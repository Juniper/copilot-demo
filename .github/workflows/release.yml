name: Release VS Code Extension

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v0.4.1, v1.0.0, etc.

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build core package
        run: npm run build:core

      - name: Build VS Code extension
        run: npm run build:vscode

      - name: Package extension
        run: |
          cd packages/vscode
          npm run package

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/vscode/*.vsix
          body: |
            ## Installation

            Download the `.vsix` file below and install it in VS Code:

            1. Download `awesome-palette-vscode-${{ steps.version.outputs.VERSION }}.vsix`
            2. Open VS Code
            3. Go to Extensions view (Ctrl+Shift+X / Cmd+Shift+X)
            4. Click the "..." menu → "Install from VSIX..."
            5. Select the downloaded file

            ## What's Changed

            See the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
